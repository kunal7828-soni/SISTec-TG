name: super_tg_attendance_dashboard
description: A scalable Flutter Web foundation for the Super TG Attendance Dashboard.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  go_router: ^16.2.0
  provider: ^6.1.5+1
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
